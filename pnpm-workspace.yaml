packages:
  - apps/*
  - packages/*

autoInstallPeers: true

# Security patches for dependencies of the Prisma CLI (pnpm audit, Day 1). Remove once Prisma ships them.
overrides:
  mysql2: 3.24.4
  deepmerge-ts: 8.0.2

# Only these dependencies may run install scripts (pnpm blocks all others by default).
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  # eslint-config-next resolver: prebuilt binaries ship as optional deps, its postinstall is not needed
  unrs-resolver: false

# Versions pinned on Day 1 that were newer than pnpm's minimum release age at the time.
minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.6'
  - '@nestjs/core@11.2.6'
  - '@nestjs/platform-express@11.2.6'
  - '@nestjs/testing@11.2.6'
  - '@turbo/darwin-64@2.11.3'
  - '@turbo/darwin-arm64@2.11.3'
  - '@turbo/linux-64@2.11.3'
  - '@turbo/linux-arm64@2.11.3'
  - '@turbo/windows-64@2.11.3'
  - '@turbo/windows-arm64@2.11.3'
  - prettier@3.9.9
  - turbo@2.11.3

# Run package scripts with a POSIX like shell on every OS, so "WORKER=1 cmd" works on Windows too.
shellEmulator: true
